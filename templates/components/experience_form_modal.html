<div id="add-experience-modal"
     class="form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-experience-modal-title">
  <button type="button"
          class="form-modal__backdrop"
          popovertarget="add-experience-modal"
          popovertargetaction="hide"
          aria-label="Tutup form tambah pengalaman"></button>

  <div class="form-modal__content">
    <button type="button"
            class="form-modal__close"
            popovertarget="add-experience-modal"
            popovertargetaction="hide"
            aria-label="Tutup form tambah pengalaman">&times;</button>
    <h2 id="add-experience-modal-title">Tambah Pengalaman</h2>

    <form id="experience-form"
          method="post"
          action="{% url 'main:create_experience' %}"
          class="project-form">
      {% csrf_token %}
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.help_text %}
            <p class="form-help">{{ field.help_text }}</p>
          {% endif %}
          {% for error in field.errors %}
            <p class="form-error">{{ error }}</p>
          {% endfor %}
        </div>
      {% endfor %}
      <div class="form-modal__actions">
        <button type="button"
                class="button button-secondary"
                popovertarget="add-experience-modal"
                popovertargetaction="hide">Batal</button>
        <button type="submit" class="button">Tambah Pengalaman</button>
      </div>
    </form>
  </div>
</div>
